services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest
      POSTGRES_DB: ingest
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest -d ingest"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ingest:
    build: .
    init: true
    shm_size: "1gb"
    environment:
      DATABASE_URL: postgresql+psycopg://ingest:ingest@postgres:5432/ingest
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_BLOB_CONTAINER: ${AZURE_BLOB_CONTAINER:-catalog-images}
      CRAWL_DELAY_SECONDS: ${CRAWL_DELAY_SECONDS:-1}
      MAX_PAGES: ${MAX_PAGES:-2000}
      MAX_DEPTH: ${MAX_DEPTH:-8}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-8000000}
      MAX_IMAGES_PER_PRODUCT: ${MAX_IMAGES_PER_PRODUCT:-8}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
